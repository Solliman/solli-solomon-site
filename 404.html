<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — Solli Solomon</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
/* Pagina 404 (audit SEO 16/11/2026): prima Cloudflare Pages rispondeva con la home e codice 200 a ogni indirizzo sbagliato. */
body { cursor: auto; }
.nf { max-width: 640px; margin: 0 auto; padding: 18vh 24px 80px; text-align: center; }
.nf .code { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.3em; color: var(--muted); }
.nf h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 7vw, 60px); margin: 16px 0; }
.nf p { color: var(--muted); line-height: 1.6; }
.nf nav { margin-top: 32px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
.nf nav a { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); text-decoration: none; }
.nf nav a:hover { color: var(--accent); }
</style>
</head>
<body>
<main class="nf">
<div class="code">404</div>
<h1>Questa pagina non c'è</h1>
<p>L'indirizzo è sbagliato o la pagina è stata spostata.<br>This page doesn't exist.</p>
<nav>
<a href="/">Home</a>
<a href="/riflessioni/">Riflessioni</a>
<a href="/en">English</a>
<a href="/links">Link</a>
</nav>
</main>
</body>
</html>
