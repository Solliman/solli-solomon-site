<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
--bg: #07090b;
--surface: #0c0f12;
--border: #181f24;
--text: #e2e8e4;
--muted: #485560;
--accent: #00c8b4;
--accent-dim: rgba(0,200,180,0.09);
--warm: #d4874a;
}
html { scroll-behavior:smooth; }
body {
background:var(--bg);
color:var(--text);
font-family:'DM Mono',monospace;
font-weight:300;
font-size:13px;
line-height:1.8;
cursor:none;
}
body::before {
content:''; position:fixed; inset:0; pointer-events:none; z-index:9000; opacity:0.45;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
/* CURSORE: cerchio piccolo */
.cursor {
position:fixed;
width:8px; height:8px;
background:var(--accent);
border-radius:50%;
pointer-events:none;
z-index:9999;
transform:translate(-50%,-50%);
transition:transform 0.15s ease, background 0.2s;
}
.cursor.on-button { background:#ffffff; transform:translate(-50%,-50%) scale(1.4); }
.cursor.clicking { background:#ffffff; transform:translate(-50%,-50%) scale(0.7); }
/* CURSORE INSEGUITORE: croce cristiana SVG */
.cursor-ring {
position:fixed;
width:36px; height:44px;
pointer-events:none;
z-index:9998;
transform:translate(-50%,-50%);
transition:transform 0.2s, opacity 0.2s;
}
.cursor-ring svg .cross-shape {
fill: var(--accent);
transition: fill 0.2s;
}
.cursor-ring.on-button svg .cross-shape { fill: #ffffff; }
.cursor-ring.clicking svg .cross-shape { fill: #ffffff; }
/* HEADER */
header {
position:fixed; top:0; left:0; right:0; z-index:100;
display:flex; justify-content:space-between; align-items:center;
padding:24px 52px;
border-bottom:1px solid transparent;
transition:background 0.5s, border-color 0.5s;
}
header.scrolled { background:rgba(7,9,11,0.93); backdrop-filter:blur(18px); border-color:var(--border); }
.logo { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:300; letter-spacing:0.32em; text-transform:uppercase; color:var(--text); text-decoration:none; }
nav { display:flex; gap:36px; }
nav a { color:var(--muted); text-decoration:none; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; transition:color 0.3s; }
nav a:hover { color:var(--accent); }
/* HERO */
#hero {
min-height:100vh; position:relative;
display:flex; flex-direction:column; justify-content:flex-end;
padding:0 52px 90px; overflow:hidden;
}
.hero-bg {
position:absolute; inset:0;
background-image:url('solli-banner.png');
background-size:cover; background-position:center 30%;
}
.hero-bg::after {
content:''; position:absolute; inset:0;
background: linear-gradient(to bottom,
rgba(7,9,11,0.25) 0%,
rgba(7,9,11,0.15) 35%,
rgba(7,9,11,0.7) 70%,
rgba(7,9,11,0.97) 100%);
}
.hero-content { position:relative; z-index:2; max-width:700px; }
.hero-tag { font-size:10px; letter-spacing:0.42em; text-transform:uppercase; color:var(--accent); margin-bottom:20px; opacity:0; animation:fadeUp 1s 0.3s forwards; }
.hero-title { font-family:'Cormorant Garamond',serif; font-size:clamp(64px,10vw,136px); font-weight:300; line-height:0.87; letter-spacing:-0.01em; margin-bottom:30px; opacity:0; animation:fadeUp 1s 0.55s forwards; }
.hero-title em { font-style:italic; color:var(--accent); }
.hero-sub { max-width:420px; color:rgba(226,232,228,0.65); font-size:12px; line-height:2.1; margin-bottom:48px; opacity:0; animation:fadeUp 1s 0.8s forwards; }
.hero-cta { display:flex; gap:20px; align-items:center; opacity:0; animation:fadeUp 1s 1s forwards; flex-wrap:wrap; }
.btn-primary { background:var(--accent); color:#07090b; text-decoration:none; padding:14px 32px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.28em; text-transform:uppercase; transition:background 0.3s,transform 0.2s; white-space:nowrap; }
.btn-primary:hover { background:#00e0ca; transform:translateY(-1px); }
.btn-ghost { color:rgba(226,232,228,0.55); text-decoration:none; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; border-bottom:1px solid var(--border); padding-bottom:2px; transition:color 0.3s,border-color 0.3s; white-space:nowrap; }
.btn-ghost:hover { color:var(--text); border-color:var(--muted); }
.scroll-indicator { position:absolute; bottom:38px; right:52px; z-index:2; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--muted); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; opacity:0; animation:fadeUp 1s 1.3s forwards; }
.scroll-bar { width:1px; height:52px; background:linear-gradient(to bottom,var(--accent),transparent); animation:scrollPulse 2s ease-in-out infinite; }
@keyframes scrollPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
/* SECTIONS */
section { padding:116px 52px; }
.sec-label { font-size:10px; letter-spacing:0.42em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.sec-divider { width:36px; height:1px; background:var(--border); margin-bottom:60px; }
/* BIO */
#bio { border-top:1px solid var(--border); }
.bio-grid { display:grid; grid-template-columns:380px 1fr; gap:90px; align-items:center; }
.bio-img-wrap { position:relative; }
.bio-img-frame { position:absolute; top:-14px; left:-14px; right:14px; bottom:14px; border:1px solid var(--accent-dim); pointer-events:none; }
.bio-img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top center; border:1px solid var(--border); display:block; filter:contrast(1.05) saturate(0.9); }
.bio-text h2 { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:300; line-height:1.1; margin-bottom:28px; }
.bio-text h2 em { font-style:italic; color:var(--accent); }
.bio-text p { color:var(--muted); margin-bottom:18px; line-height:2.15; font-size:13px; }
.bio-text p strong { color:var(--text); font-weight:400; }
.bio-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:36px; }
.bio-tag { border:1px solid var(--border); padding:5px 15px; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); transition:border-color 0.3s,color 0.3s; }
.bio-tag:hover { border-color:var(--accent); color:var(--accent); }
/* DISCOGRAFIA */
#music { border-top:1px solid var(--border); background:var(--surface); }
.music-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:56px; flex-wrap:wrap; gap:16px; }
.music-header h2 { font-family:'Cormorant Garamond',serif; font-size:44px; font-weight:300; line-height:1.1; }
.music-header h2 em { font-style:italic; color:var(--accent); }
.music-header a { color:var(--accent); text-decoration:none; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; border-bottom:1px solid var(--accent-dim); padding-bottom:2px; transition:border-color 0.3s; }
.music-header a:hover { border-color:var(--accent); }
.music-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); }
