name: 📅 Solli Post Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'  # Ogni 5 minuti
  workflow_dispatch:        # Trigger manuale da GitHub

jobs:
  send-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scheduler
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 workflow/scheduler.py

      - name: Aggiorna stato invio
        run: |
          git config user.name "Solli Bot"
          git config user.email "bot@sollisolomon.com"
          git diff --quiet workflow/calendar.json || \
          (git add workflow/calendar.json && \
           git commit -m "✅ Post inviato automaticamente" && \
           git push)
