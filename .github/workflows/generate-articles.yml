name: 📝 Rigenera pagine Riflessioni + feed

on:
  push:
    branches: [main]
    paths:
      - "articles_data.js"
      - "articles_data_en.js"
      - "workflow/generate_articles.py"
  workflow_dispatch:        # Trigger manuale da GitHub, se serve

# Le automazioni che fanno commit sul repo girano una alla volta: se partono
# insieme sullo stesso push, il secondo "git push" verrebbe rifiutato.
concurrency:
  group: auto-commit-sito
  cancel-in-progress: false

jobs:
  build-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Genera pagine riflessioni/, feed-riflessioni.xml e sitemap.xml
        run: python3 workflow/generate_articles.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "Solli Bot"
          git config user.email "bot@sollisolomon.com"
          git add riflessioni/ feed-riflessioni.xml sitemap.xml articles_data.js articles_data_en.js
          git diff --quiet --cached || \
          (git commit -m "📝 Aggiorna pagine Riflessioni + feed (auto)" && \
           git pull --rebase origin main && \
           git push)

      # Avvisa Bing (IndexNow) delle pagine riflessioni nuove o cambiate, dopo il deploy di Cloudflare.
      - name: Avvisa Bing con IndexNow
        continue-on-error: true
        run: |
          sleep 120
          python3 - <<'PY'
          import json, subprocess, urllib.request
          righe = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD", "--", "riflessioni/"],
                                 capture_output=True, text=True).stdout.split()
          urls = ["https://sollisolomon.com/" + r[:-5].removesuffix("index") for r in righe if r.endswith(".html")]
          if urls:
              chiave = "5abcd6d01e0452a16fd9ca12424dcf96"
              corpo = json.dumps({"host": "sollisolomon.com", "key": chiave,
                                  "keyLocation": f"https://sollisolomon.com/{chiave}.txt", "urlList": urls}).encode()
              r = urllib.request.urlopen(urllib.request.Request("https://api.indexnow.org/indexnow", corpo,
                                         {"Content-Type": "application/json; charset=utf-8"}))
              print(len(urls), "pagine inviate a IndexNow:", r.status)
          PY
