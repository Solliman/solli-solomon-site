version: '3.8'

# NOTA: il servizio "telegram-bot" che stava qui è stato rimosso perché duplicava,
# con lo stesso identico container_name "solli-telegram-bot", quello già definito
# in "04 - Scripts/02 - telegram_bot/docker-compose.yml" — i due avviavano lo stesso
# script con lo stesso token, causando conflitti di polling su Telegram (risposte
# perse in modo intermittente). Quello in "04 - Scripts/02 - telegram_bot/" resta
# l'unica sorgente valida per il bot Telegram.

services:
  antigravity-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solli-antigravity-web
    restart: always
    ports:
      - "8080:8080"
    working_dir: /app/01 - SSSite/06 - antigravity_app
    volumes:
      - ../../:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
