<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solli Solomon — Links</title>
    <meta name="description" content="Ascolta e connettiti con Solli Solomon. Bandcamp, Spotify, Telegram Cenacolo.">
    <!-- Font Ufficiali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            /* Stessa palette di redesign_D_cenacolo_chiaro.html */
            --bg: #f2ecdd;
            --bg2: #ece3cf;
            --card: #fbf7ee;
            --ink: #1a140d;
            --text: #1a140d;
            --muted: #867a63;
            --accent: #b8893f; /* Oro */
            --accent-bright: #d9a94f;
            --accent-dim: rgba(184, 137, 63, 0.14);
            --border: rgba(26, 20, 13, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-photo {
            width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 16px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }
        h1 em { font-style: italic; color: var(--accent); }
        .subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 32px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
        }
        .link-btn:hover {
            background: var(--bg2);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        /* Bottoni In Evidenza */
        .link-btn.featured-bandcamp {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--accent-bright);
            font-weight: bold;
            box-shadow: 0 4px 14px rgba(26, 20, 13, 0.25);
        }
        .link-btn.featured-bandcamp:hover {
            background: #2a2014;
            box-shadow: 0 6px 18px rgba(26, 20, 13, 0.3);
        }
        .link-btn.featured-telegram {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--ink);
            font-weight: bold;
        }
        .link-btn.featured-telegram:hover {
            background: rgba(184, 137, 63, 0.24);
        }
        .link-btn.site-btn {
            border-style: dashed;
            color: var(--accent);
        }
        .btn-icon {
            margin-right: 10px;
            font-size: 16px;
        }
        footer {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.1em;
            margin-top: auto;
        }
        .lang-switch {
            margin-top: 16px;
            font-size: 11px;
        }
        .lang-switch a {
            color: var(--muted);
            text-decoration: none;
            margin: 0 8px;
        }
        .lang-switch a.active {
            color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="solli-bio-photo.png" alt="Solli Solomon" class="profile-photo">
        <h1>Solli <em>Solomon</em></h1>
        <p class="subtitle">Techno Cristiana & Elettronica Spirituale</p>

        <div class="links-list">
            <!-- WEPT - ASCOLTA ORA (Featured - TooLost) -->
            <a href="https://too.fm/8j4eb3e" class="link-btn featured-bandcamp" target="_blank" rel="noopener" style="box-shadow: 0 0 20px rgba(184,137,63,0.4);">
                <span class="btn-icon">⚡</span> Ascolta "Wept" (Ascolta Ora)
            </a>

            <!-- BANDCAMP (Ascolto & Supporto Principale) -->
            <a href="https://sollisolomon.bandcamp.com" class="link-btn featured-bandcamp" target="_blank" rel="noopener">
                <span class="btn-icon">◈</span> Ascolta & Supporta su Bandcamp
            </a>

            <!-- TELEGRAM CENACOLO (Fidelizzazione e Contatto) -->
            <a href="https://t.me/+TlzorC1zSkY5YzI0" class="link-btn featured-telegram" target="_blank" rel="noopener">
                <span class="btn-icon">💬</span> Entra nel Cenacolo (Telegram)
            </a>

            <!-- SITO WEB UFFICIALE (Esplora tutto) -->
            <a href="https://sollisolomon.pages.dev" class="link-btn site-btn">
                <span class="btn-icon">✦</span> Visita il Sito Ufficiale
            </a>

            <!-- SPOTIFY (Streaming Secondario) -->
            <a href="https://open.spotify.com/intl-it/artist/2x5xoFyjt2akRu1zYfcf9X" class="link-btn" target="_blank" rel="noopener">
                <span class="btn-icon">◎</span> Ascolta su Spotify
            </a>

            <!-- YOUTUBE -->
            <a href="https://youtube.com/channel/UCEs3dfxua348gojTw109OMw?si=9y4FDnALHau2HuM9" class="link-btn" target="_blank" rel="noopener">
                <span class="btn-icon">▶</span> Canale YouTube (Tema)
            </a>

            <!-- CONTATTI -->
            <a href="https://sollisolomon.pages.dev#contact" class="link-btn">
                <span class="btn-icon">✉</span> Scrivimi in privato
            </a>
        </div>

        <footer>
            © 2026 Solli Solomon
        </footer>

        <div class="lang-switch">
            <a href="links.html" class="active">IT</a> | <a href="en-links.html">EN</a>
        </div>
    </div>
</body>
</html>
